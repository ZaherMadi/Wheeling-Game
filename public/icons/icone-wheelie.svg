<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#d4dae4"/>
      <stop offset="68%" stop-color="#7c8594"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="55%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ff8c1a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <!-- Orange wheelie ground arc -->
  <path d="M18 100c22-4 46-5 72-1-24-2-48 0-72 5z" fill="url(#orange)"/>
  <path d="M40 105c18-3 36-3 52 1-16-2-34-1-52 2z" fill="url(#orange)" opacity="0.72"/>
  <!-- Motocross rear & raised front wheels -->
  <g stroke="#0d1117" stroke-width="2">
    <circle cx="44" cy="86" r="15.5" fill="url(#steel)"/>
    <circle cx="44" cy="86" r="10.2" fill="#11161f"/>
    <circle cx="44" cy="86" r="4.8" fill="url(#chrome)"/>
    <circle cx="94" cy="48" r="15" fill="url(#steel)"/>
    <circle cx="94" cy="48" r="9.8" fill="#11161f"/>
    <circle cx="94" cy="48" r="4.6" fill="url(#chrome)"/>
  </g>
  <!-- Inclined motocross chassis, engine, swingarm, forks & high fender -->
  <path d="M44 86l19-14 14-24 17 0" fill="none" stroke="url(#chrome)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M51 74l13-13 13-18 6 7-13 18-12 10z" fill="url(#steel)" stroke="#0d1117" stroke-width="1.6"/>
  <path d="M23 73c12-4 24-8 38-17l13-14-7-5-16 14c-10 8-19 14-31 19z" fill="url(#chrome)" stroke="#0d1117" stroke-width="1.5"/>
  <path d="M77 32l12-10c6 1 11 4 14 9-6-2-12-1-17 3z" fill="url(#chrome)" stroke="#0d1117" stroke-width="1.4"/>
  <!-- Seated rider popping wheelie -->
  <path d="M44 59c-4-7-3-16 1-23l13 2 14 1v6l-13 2-5 10 10 10-4 7-14-8z" fill="url(#chrome)" stroke="#0d1117" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M55 68l10 11 9-1-6 6-14-3z" fill="url(#steel)" stroke="#0d1117" stroke-width="1.3"/>
  <!-- Rider MX helmet -->
  <path d="M43 22c3-5 11-7 16-3 3 3 3 8 0 12l-8 2-8-3c-1-3-1-6 0-8z" fill="url(#chrome)" stroke="#0d1117" stroke-width="1.7"/>
  <path d="M52 21l9-2-3 4z" fill="url(#chrome)" stroke="#0d1117" stroke-width="1.2"/>
  <path d="M53 24l6-1-1 5-6 1z" fill="#11161f"/>
</svg>
